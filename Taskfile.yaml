version: '3'
vars:
  ARTIFACT_NAME: cryptos-appliance
  TESTPARALLELISM: 4
  GOLIC_VERSION: v1.2.0
  GOLANGCI_VERSION: v2.12.2
  COMMON_LIC: "The CryptOS Authors."
  TEMPLATE_LIC: "apache2"
tasks:
  default:
    cmds:
      - task: lint
  fmt:
    desc: Format Go sources
    cmds:
      - gofmt -w .
  build:
    desc: Build all packages
    cmds:
      - go build ./...
  test:
    desc: Run tests
    cmds:
      - go test -parallel {{.TESTPARALLELISM}} ./...
  vet:
    desc: Run go vet
    cmds:
      - go vet ./...
  ci:
    desc: Full local validation chain (fmt + lint + vet + test + build)
    cmds:
      - task: fmt
      - task: lint
      - task: vet
      - task: test
      - task: build
  test-cover:
    desc: Run tests with coverage reporting
    cmds:
      - go test ./... -cover
  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...
  lint-init:
    desc: Install lint dependencies (golangci-lint is built with the local Go toolchain)
    cmds:
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_VERSION}}
  license:
    desc: Verify every source file carries the license header and LICENSE is the verbatim Apache 2.0 text (CI; never writes).
    cmds:
      - go install github.com/Bugs5382/golic/cmd/golic@{{.GOLIC_VERSION}}
      - golic inject -t {{.TEMPLATE_LIC}} -c "{{.COMMON_LIC}}" --license-file --dry -x
  license:fix:
    desc: Inject the license header into any source file missing it and rewrite LICENSE to the verbatim Apache 2.0 text.
    cmds:
      - go install github.com/Bugs5382/golic/cmd/golic@{{.GOLIC_VERSION}}
      - golic inject -t {{.TEMPLATE_LIC}} -c "{{.COMMON_LIC}}" --license-file
