name: Image build (kernel, rootfs, UKI, release assets)

# Build the UKI on a GitHub-hosted runner. amd64 builds on ubuntu-24.04;
# arm64 builds on the hosted ubuntu-24.04-arm runner (selectable via manual
# dispatch). The build toolchain (kernel deps, ukify, sbsign, mksquashfs) is
# installed per run — no pre-provisioned or self-hosted runner.
#
# Two paths, never crossed:
#   - push to main / manual dispatch: the signed smoke build. A per-run
#     ephemeral key signs the UKI and is stamped in as the upgrade anchor, to
#     exercise rootfs:build and uki:sign. That key is discarded with the run,
#     so NOTHING this path builds is uploaded, not even as an Actions artifact.
#   - manual dispatch with release_assets: a build-only rehearsal of the
#     release assets with `task iso:unsigned` and no Secure Boot variables at
#     all. They carry no signature and no upgrade anchor, and nothing signs
#     or attests them; users sign with their own key (docs/secure-boot.md).
#     Nothing here is attached to anything. On a real v* tag, release.yml's
#     own assets job builds and attaches them, after the ESXi gate passes.
#
# Not triggered by pull_request: the kernel compile is expensive, so it runs
# on push to main and manual dispatch. Use workflow_dispatch on a branch to
# validate image changes before merging.

on:
  push:
    branches: [main]
    # Don't run an expensive image build for changes that can't affect the
    # image: docs, issue templates, and the sibling workflows. Editing
    # ci-image.yml itself still builds.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/ci-go.yml"
      - ".github/workflows/cron-cleanup-runs.yml"
      - ".github/workflows/release-drafter.yml"
      - ".github/release-drafter.yml"
  workflow_dispatch:
    inputs:
      arch:
        description: "Target architecture"
        default: amd64
        type: choice
        options: [amd64, arm64]
      release_assets:
        description: "Build the unsigned release assets (as a v* tag would) instead of the signed smoke build; nothing is published"
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-image:
    name: Build and sign the UKI (ephemeral CI key, not published)
    if: ${{ !inputs.release_assets }}
    # amd64 -> ubuntu-24.04 (x86_64); arm64 -> the hosted arm64 runner.
    runs-on: ${{ (github.event.inputs.arch == 'arm64') && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 60
    env:
      ARCH: ${{ github.event.inputs.arch || 'amd64' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history and tags so build/ci/buildinfo.sh can `git describe`
          # the build; a shallow clone only yields the bare commit hash.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install build toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          # systemd-boot-efi provides the EFI stub ukify wraps the kernel in
          # (/usr/lib/systemd/boot/efi/linuxx64.efi.stub). cryptsetup is built
          # from source (Docker + Alpine), not installed here.
          # python3-pefile: ukify imports the Python `pefile` module and
          # systemd-ukify does not pull it in, so uki:assemble fails with
          # "ModuleNotFoundError: No module named 'pefile'" without it.
          sudo apt-get install -y --no-install-recommends \
            build-essential bc flex bison libelf-dev libssl-dev xz-utils \
            squashfs-tools sbsigntool systemd-ukify systemd-boot-efi cpio \
            python3-pefile xorriso mtools dosfstools

      - name: Install go-task
        run: go install github.com/go-task/task/v3/cmd/task@latest

      # Cache the kernel source tree + build artifacts across runs so only
      # the first build pays the full compile cost.
      - name: Cache kernel build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: build/.work/kernel
          key: kernel-${{ env.ARCH }}-${{ hashFiles('build/ci/versions.env', 'build/kernel/cryptos.config') }}

      - name: Generate SB key
        run: |
          set -euo pipefail
          mkdir -p build/.work/ci
          go build -o build/.work/ci/cryptos-sbkey ./cmd/cryptos-sbkey
          build/.work/ci/cryptos-sbkey --out-dir build/.work/ci \
            --cn "CryptOS Secure Boot (ephemeral CI)" --days 1

      - name: Build image
        env:
          SB_KEY: ${{ github.workspace }}/build/.work/ci/sb.key
          SB_CERT: ${{ github.workspace }}/build/.work/ci/sb.crt
        run: task image ARCH="$ARCH"

      # The same check the release job runs in reverse: here the anchor must be
      # present, which proves the release job's "no anchor" check can see one.
      - name: Confirm the CI anchor was stamped
        run: |
          set -euo pipefail
          init="build/.work/rootfs-${ARCH}/init"
          grep -q -a -F "$(openssl x509 -in build/.work/ci/sb.crt -outform DER | base64 -w0)" "$init"
          grep -q -a -E 'MII[A-Za-z0-9+/]{400,}' "$init"
          echo "anchor stamped (CI key; this build is not published)"

      # Deliberately no upload-artifact step: this UKI is signed by, and
      # anchored to, a key that no longer exists once the run ends.
      - name: Discard the ephemeral key
        if: always()
        run: rm -rf build/.work/ci

  # The release assets: unsigned, no upgrade anchor, built with no Secure Boot
  # variables in the environment. Manual dispatch only, to rehearse the build
  # without attaching anything; release.yml builds and attaches them for real
  # on a v* tag, after the ESXi gate passes.
  release-assets:
    name: Build the unsigned release assets
    if: ${{ inputs.release_assets }}
    runs-on: ${{ (github.event.inputs.arch == 'arm64') && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    env:
      ARCH: ${{ github.event.inputs.arch || 'amd64' }}
      # The platform/statekey variants published for each release.
      PLATFORM: vmware
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history and tags so buildinfo.sh stamps the tag as the version.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install build toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          # Same list as build-image (see the notes there). Nothing is signed
          # here; sbsigntool is only for the sbverify check below.
          sudo apt-get install -y --no-install-recommends \
            build-essential bc flex bison libelf-dev libssl-dev xz-utils \
            squashfs-tools sbsigntool systemd-ukify systemd-boot-efi cpio \
            python3-pefile xorriso mtools dosfstools

      - name: Install go-task
        run: go install github.com/go-task/task/v3/cmd/task@latest

      - name: Cache kernel build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: build/.work/kernel
          key: kernel-${{ env.ARCH }}-${{ hashFiles('build/ci/versions.env', 'build/kernel/cryptos.config') }}

      - name: Refuse Secure Boot variables
        run: |
          set -euo pipefail
          if env | grep -E '^SB_(KEY|CERT)=' >/dev/null; then
            echo "SB_KEY/SB_CERT must not be set for release assets" >&2
            exit 1
          fi

      # One kernel build (PLATFORM=vmware) serves both variants; each variant
      # gets its own rootfs, UKI and ISO. The UKI is copied out under a variant
      # name before the next build overwrites build/out/cryptos-<arch>.uki.unsigned.
      - name: Build the unsigned images
        run: |
          set -euo pipefail
          mkdir -p dist
          # The build-number tag every artifact file name carries; the ISO
          # already has it baked in by build/iso/build.sh, so this just
          # reconstructs the same name to copy from and names the UKI copy.
          build_tag="$(bash build/ci/artifact-name.sh)"
          for statekey in tpm nodeid; do
            suffix=""
            [ "$statekey" = nodeid ] && suffix="-nodeid"
            task iso:unsigned ARCH="$ARCH" PLATFORM="$PLATFORM" STATEKEY="$statekey"

            # No upgrade anchor: the stamped anchor is a base64 X.509 DER
            # string in /init; build-image proves this pattern finds one.
            init="build/.work/rootfs-${ARCH}/init"
            if grep -q -a -E 'MII[A-Za-z0-9+/]{400,}' "$init"; then
              echo "release build of $statekey carries an upgrade anchor" >&2
              exit 1
            fi
            # No Authenticode signature on the UKI.
            uki="build/out/cryptos-${ARCH}.uki.unsigned"
            if sbverify --list "$uki" 2>&1 | grep -q 'signature 1'; then
              echo "release UKI of $statekey carries a signature" >&2
              exit 1
            fi

            cp "$uki" "dist/cryptos-${ARCH}-${PLATFORM}${suffix}-${build_tag}.uki.unsigned"
            cp "build/out/cryptos-${ARCH}-${PLATFORM}${suffix}-unsigned-${build_tag}.iso" dist/
          done

      # cryptosctl for operator workstations, stamped with the same build
      # identity as the image (build/ci/buildinfo.sh) and the same build-number
      # tag as the image artifacts (build/ci/artifact-name.sh). Proves the
      # cross-builds succeed; nothing here is uploaded or attached anywhere.
      - name: Cross-build cryptosctl
        run: |
          set -euo pipefail
          ldflags="-s -w $(bash build/ci/buildinfo.sh)"
          build_tag="$(bash build/ci/artifact-name.sh)"
          for os in linux darwin; do
            for cpu in amd64 arm64; do
              CGO_ENABLED=0 GOOS="$os" GOARCH="$cpu" go build -trimpath \
                -ldflags "$ldflags" -o "dist/cryptosctl-${os}-${cpu}-${build_tag}" github.com/CryptOS-PKI/cryptos-node/cmd/cryptosctl
            done
          done

      - name: Write the build record
        run: |
          set -euo pipefail
          build/ci/build-manifest.sh dist/* > dist/build-manifest.json
          cat dist/build-manifest.json

      - name: Write SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      # The project signs nothing. This fails the run if any UKI, on its own or
      # inside an ISO, carries an Authenticode signature, if a signature,
      # certificate or attestation file is present, or if SHA256SUMS does not
      # cover every file. The test proves the check catches a signed image.
      - name: Check nothing is signed
        run: |
          set -euo pipefail
          bash build/release/check-unsigned_test.sh
          bash build/release/check-unsigned.sh dist

      # Deliberately no upload-artifact step: this is a dispatch-only rehearsal
      # of the build, and nothing it produces is attached anywhere. On a real
      # v* tag, release.yml's own assets job builds and attaches these files,
      # after the ESXi gate passes.
